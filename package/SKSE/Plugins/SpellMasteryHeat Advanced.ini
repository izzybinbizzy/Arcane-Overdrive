; Arcane Overdrive - the advanced settings: every number. Whole numbers only. Edit with the game closed, or press
; "Read the advanced file again" in the menu. Picking a preset in the menu rewrites the values it sets.
[Overdrive]
; how fast casting fills the Overdrive bar, percent (25 to 300)
ChargeSpeed=100
; a held spell (Flames, Sparks) against a cast one, percent (10 to 200)
HeldGain=60
; how much of the bar drains a second once the grace period is over (1 to 50; the bar runs 0 to 100)
DrainSpeed=5
; seconds after your last cast before the bar drains (0 to 10)
GraceSeconds=3
; how much faster the bar fills when you cast the same school as your last spell, percent (0 to 200)
SameSchoolBonus=50
; how much of the bar is lost when you cast a different school (0 to 100)
SwitchLoss=25
; how long Overdrive lasts, seconds (1 to 30)
BurstSeconds=6
; the burnout after it, both bars locked at zero, seconds (0 to 60)
CooldownSeconds=10
; with slow magicka on: magicka comes back at this percent of its speed in the burnout (0 to 100)
SlowMagickaTo=40
; with weaker spells on: how much weaker your spells are in the burnout, percent (0 to 90)
WeakerBy=15

[Heat]
; how Heat lets Overdrive go: 0 the sweet spot (Heat between BandLow and RedLine), 1 vent (Heat below RedLine), 2 focus (Heat at BandLow or hotter and FocusMs of holding the key, or both hands' spells charged)
Gate=0
; the sweet spot's bottom (0 to 95)
BandLow=50
; the red zone starts here: the sweet spot's top, where your spells turn wild (10 to 100)
RedLine=85
; how fast Heat climbs, percent (25 to 300)
HeatUp=100
; how fast Heat cools, percent (25 to 300)
HeatDown=100
; Heat a cast adds, percent of what it adds to the Overdrive bar (0 to 1000)
HeatPerCast=150
; Heat a held spell adds a second, percent of a cast of its cost (0 to 2000)
HeatHeld=300
; extra Heat for the same element as your last spell, percent (0 to 300)
HeatSameElement=25
; extra Heat for a dual cast, percent (0 to 300)
HeatDual=50
; the part of its Heat the bar loses a second, percent (5 to 100)
Cooling=25
; the Heat at which you turn Warm (5 to 90)
WarmAt=25
; ... Hot (10 to 95)
HotAt=50
; ... Overheating (15 to 99)
OverheatingAt=75
; the Heat a misfire sheds (0 to 100)
MisfireDrop=25
; with backlash on: the bite a misfire takes out of your magicka, percent of the pool (0 to 50)
BacklashMagicka=15
; the focus gate's hold, milliseconds (0 to 5000)
FocusMs=1000

[Bonus]
; with the damage bonus on: Warm adds this to your spells, Hot twice, Overheating three times, percent (0 to 25)
BonusPerStage=4
; the bonus while Overdrive lasts, percent (0 to 100)
OverdriveBonus=25

[Display]
; with light growth on: how much brighter and wider the hand lights grow a stage, percent (0 to 100)
LightPerStage=15

[Growth]
; with spells growing on: how much bigger they are with a full Overdrive bar and through Overdrive, percent (100 = double, 0 to 200)
GrowthMax=100
; with impacts growing on: the share of that growth your explosions, hazards and hit effects take when they are made, percent (0 to 100)
ImpactGrowth=75
; with the red zone on: how wild your spells act while Heat is in the red outside Overdrive, percent (100 = as designed, 0 to 200)
Wildness=100

[Marks]
; scorch and frost marks alive at once (1 to 20)
MarkMax=6
; how long a mark lasts, seconds (2 to 30)
MarkSeconds=8
; with marks hurting on: health a second to who stands in one, x1.5 in Overdrive (0 to 50)
MarkHurtPerSecond=5

[Debug]
; 1: each cast, the bars after it and each release of Overdrive go into SpellMasteryHeat.log
DebugLog=0
