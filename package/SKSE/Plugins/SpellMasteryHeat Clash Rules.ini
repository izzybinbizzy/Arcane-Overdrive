; Arcane Overdrive - the clash rules. Hand-edited; the menu never writes this file.
;
; Read first; then every .ini in the SpellMasteryHeat Clash folder next to it (patches for other mods, alphabetical),
; then SpellMasteryHeat Clashes.ini (the menu's settings). A later file changes only what it names.
;
; Only hostile projectiles clash: arrows, bolts, and spells that harm (a spell that harms nobody, like Magelight or a
; mod's invisible scripted projectile, is never touched).

[Elements]
; Which keywords on a spell's effect make it which element. Checked in this order (Fire first); the first match wins.
; An effect with none of these falls back to its resist value (Resist Fire, Frost, Shock or Poison), then a shout's
; cone with no element is Force (Unrelenting Force), then anything else is Arcane. Arrows are Physical unless their
; enchantment says otherwise.
; "Fire=A, B" replaces the list; "Fire=+C" adds to it (use + in patches, so two patches do not undo each other).
Fire=MagicDamageFire
Frost=MagicDamageFrost
Shock=MagicDamageShock
Poison=
Arcane=
Physical=
Force=

[Reactions]
; What happens when two projectiles of these elements meet (the elements: Fire, Frost, Shock, Poison, Arcane,
; Physical, Force; * is every element):
;   Clash       the stronger destroys the weaker and flies on (weakened) if it is at least Overpower times stronger;
;               closer than that, both are destroyed. A spell's strength is its magicka cost (dual cast: more); an
;               arrow's is its damage times ArrowScale; a shout's is ShoutStrength.
;   Annihilate  both are destroyed, whatever their strength
;   Wins        the first destroys the second and flies on untouched ("Loses": the other way round)
;   Pass        they fly through each other
; A pair is set both ways at once: "Fire.Frost=Annihilate" is also Frost against Fire. Later lines override earlier.
; Beams (lightning bolts), wall spells and cones (shouts) are never destroyed; they can still destroy.
; Spell struggles: two streams (sprays, held beams, breath) whose pair is Clash lock together instead; an
; Annihilate pair (Fire and Frost) locks too while "OppositesLock" is on. Pass, Wins and Loses never lock. Two
; streams that do not lock pass through each other (a held stream is never destroyed).
*.*=Clash
Fire.Frost=Annihilate
Force.*=Wins
Force.Force=Pass

[Exclude]
; Projectiles, spells, magic effects, ammo or weapons the clashes never touch, by plugin and form ID
; ("Skyrim.esm|0x012345") or editor ID (only for forms whose editor IDs the game keeps). Comma-separated; any key.
; Forms=MyMod.esp|0x000801, MyMod.esp|0x000802
